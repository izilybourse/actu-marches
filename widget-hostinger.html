<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prosto+One&display=swap');
#izily-actu{background:#000;color:#fff;font-family:'Inter',sans-serif;line-height:1.7;padding:24px 16px;box-sizing:border-box}
#izily-actu *{box-sizing:border-box}
#izily-actu .ia-wrap{max-width:860px;margin:0 auto}
#izily-actu .ia-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
#izily-actu .ia-badge{display:inline-block;border:1px solid #FF5500;color:#FF5500;border-radius:999px;padding:4px 14px;font-size:.78rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
#izily-actu select{background:#111;color:#fff;border:1px solid #FF5500;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:.9rem;max-width:100%}
#izily-actu .ia-meta{color:#A0A0A0;font-size:.85rem;margin:0 0 18px}
#izily-actu h1{font-family:'Prosto One',sans-serif;color:#FF5500;font-size:clamp(1.5rem,4.5vw,2.2rem);line-height:1.25;margin:0 0 18px;font-weight:400}
#izily-actu h2{font-family:'Prosto One',sans-serif;color:#FF5500;font-size:1.3rem;margin:30px 0 10px;font-weight:400}
#izily-actu h3{color:#fff;font-size:1.05rem;margin:18px 0 6px}
#izily-actu p,#izily-actu li{color:#e8e8e8;font-size:1rem}
#izily-actu strong{color:#fff}
#izily-actu ul{padding-left:22px}
#izily-actu li::marker{color:#FF5500}
#izily-actu section.synthese,#izily-actu section.impact{background:#111;border:1px solid #FF5500;border-radius:14px;padding:18px 22px;margin:22px 0}
#izily-actu section h2:first-child{margin-top:0}
#izily-actu blockquote{border-left:4px solid #FF5500;background:#181818;margin:18px 0;padding:12px 18px;border-radius:0 10px 10px 0;color:#d0d0d0}
#izily-actu table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.92rem}
#izily-actu th,#izily-actu td{border-bottom:1px solid #2a2a2a;padding:8px;text-align:left}
#izily-actu th{color:#FF5500}
#izily-actu a{color:#FF5500;text-decoration:none}
#izily-actu a:hover{text-decoration:underline}
#izily-actu table.cotations{background:#111;border-radius:10px;overflow:hidden}
#izily-actu table.cotations td:nth-child(n+2),#izily-actu table.cotations th:nth-child(n+2){text-align:right;white-space:nowrap}
#izily-actu .hausse{color:#2ecc71;font-weight:600}
#izily-actu .baisse{color:#ff4d4d;font-weight:600}
#izily-actu .stable{color:#A0A0A0}
#izily-actu ul.actus{list-style:none;padding-left:0}
#izily-actu ul.actus li{border-bottom:1px solid #1f1f1f;padding:6px 0;font-size:.95rem}
#izily-actu .avertissement{color:#A0A0A0;font-size:.82rem;font-style:italic}
#izily-actu footer.sources{border-top:1px solid #2a2a2a;margin-top:28px;padding-top:10px}
#izily-actu footer.sources p{color:#A0A0A0;font-size:.82rem}
#izily-actu .ia-live{background:#111;border:1px solid #FF5500;border-radius:14px;padding:16px 18px;margin:0 0 24px}
#izily-actu .ia-live h2{margin:0 0 4px;font-size:1.1rem}
#izily-actu .ia-live-meta{color:#A0A0A0;font-size:.8rem;margin:0 0 12px}
#izily-actu .ia-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2ecc71;margin-right:6px;animation:iapulse 1.6s infinite}
#izily-actu .ia-dot.old{background:#A0A0A0;animation:none}
@keyframes iapulse{50%{opacity:.25}}
#izily-actu .ia-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
#izily-actu .ia-tile{background:#181818;border-radius:10px;padding:8px 10px}
#izily-actu .ia-tile small{display:block;color:#A0A0A0;font-size:.72rem;line-height:1.3}
#izily-actu .ia-tile b{display:block;font-size:1.02rem;color:#fff;font-weight:600}
#izily-actu .ia-tile span{font-size:.85rem}
#izily-actu .ia-news h3{color:#FF5500;margin:14px 0 4px;font-size:.95rem}
#izily-actu .ia-msg{color:#A0A0A0;text-align:center;padding:40px 0}
</style>

<div id="izily-actu">
  <div class="ia-wrap">
    <div class="ia-bar">
      <span class="ia-badge">Actu marchés · mise à jour chaque soir</span>
      <select id="ia-select" aria-label="Choisir une date" style="display:none"></select>
    </div>
    <section class="ia-live" id="ia-live" style="display:none">
      <h2>Marchés en direct</h2>
      <p class="ia-live-meta" id="ia-live-meta"></p>
      <div class="ia-grid" id="ia-grid"></div>
      <div class="ia-news" id="ia-news"></div>
    </section>
    <p class="ia-meta" id="ia-meta"></p>
    <div id="ia-body"><p class="ia-msg">Chargement de l'actualité…</p></div>
  </div>
</div>

<script>
(function(){
  // URL du fichier JSON généré chaque soir par GitHub Actions
  var DATA_URL = 'https://raw.githubusercontent.com/izilybourse/actu-marches/main/data/actu.json';
  var body = document.getElementById('ia-body');
  var meta = document.getElementById('ia-meta');
  var sel  = document.getElementById('ia-select');
  var archive = [];

  function safe(html){
    var doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script,iframe,object,embed,style,link').forEach(function(n){n.remove();});
    doc.querySelectorAll('*').forEach(function(n){
      Array.prototype.slice.call(n.attributes).forEach(function(a){
        if(/^on/i.test(a.name) || /^style$/i.test(a.name) || /javascript:/i.test(a.value)) n.removeAttribute(a.name);
      });
    });
    doc.querySelectorAll('a').forEach(function(a){a.setAttribute('target','_blank');a.setAttribute('rel','noopener noreferrer');});
    return doc.body.innerHTML;
  }
  function show(i){
    var it = archive[i]; if(!it) return;
    body.innerHTML = safe(it.html);
    var d = it.updated ? new Date(it.updated) : null;
    meta.textContent = 'Séance du ' + it.label + (d ? ' · publié le ' + d.toLocaleString('fr-FR',{dateStyle:'long',timeStyle:'short'}) : '');
  }

  // Cotations et titres rafraîchis toutes les ~10 min par GitHub Actions (branche data)
  var LIVE_URL = 'https://raw.githubusercontent.com/izilybourse/actu-marches/data/live.json';
  var liveBox=document.getElementById('ia-live'), grid=document.getElementById('ia-grid'),
      lmeta=document.getElementById('ia-live-meta'), lnews=document.getElementById('ia-news');
  function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML;}
  function renderLive(j){
    var upd = new Date(j.updated), ageMin = Math.round((Date.now()-upd.getTime())/60000);
    var old = ageMin > 90;
    lmeta.innerHTML = '<span class="ia-dot'+(old?' old':'')+'"></span>Actualisé à '+
      upd.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+' ('+upd.toLocaleDateString('fr-FR')+
      ') · mise à jour automatique toutes les ~10 min en séance · cotations parfois différées de 15 min selon les places.';
    grid.innerHTML = j.quotes.map(function(q){
      return '<div class="ia-tile"><small>'+esc(q.label)+'</small><b>'+esc(q.level)+'</b><span class="'+esc(q.cls)+'">'+esc(q.change)+'</span></div>';
    }).join('');
    lnews.innerHTML = (j.news||[]).filter(function(b){return b.items&&b.items.length;}).map(function(b){
      return '<h3>'+esc(b.source)+'</h3><ul class="actus">'+b.items.map(function(i){
        var ok=/^https?:\/\//.test(i.link);
        return '<li>'+(ok?'<a href="'+esc(i.link)+'" target="_blank" rel="noopener noreferrer">'+esc(i.title)+'</a>':esc(i.title))+'</li>';
      }).join('')+'</ul>';
    }).join('');
    liveBox.style.display='';
  }
  function loadLive(){
    fetch(LIVE_URL+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();})
      .then(renderLive).catch(function(){});
  }
  loadLive(); setInterval(loadLive, 60000);
  fetch(DATA_URL + '?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(j){
      archive = (j.archive && j.archive.length) ? j.archive : [j.latest];
      archive.forEach(function(it,i){
        var o = document.createElement('option'); o.value = i; o.textContent = it.label; sel.appendChild(o);
      });
      if(archive.length > 1) sel.style.display = '';
      sel.addEventListener('change', function(){ show(parseInt(sel.value,10)); });
      show(0);
    })
    .catch(function(){ body.innerHTML = '<p class="ia-msg">L\'actualité est momentanément indisponible. Revenez dans quelques minutes.</p>'; });
})();
</script>
