name: Actu marchés quotidienne

on:
  schedule:
    - cron: "0 22 * * 1-5"   # 22h UTC, lundi-vendredi (après la clôture de Wall Street)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer l'article
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python fetch_actu.py
      - name: Publier data/actu.json
        run: |
          git config user.name "izily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/actu.json
          git diff --cached --quiet || (git commit -m "Actu marchés $(date -u +%F)" && git push)
